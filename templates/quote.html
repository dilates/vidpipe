<style>/*CSS*/

.qs .q{font-size:62px;font-weight:700;line-height:1.22;letter-spacing:-.025em;margin-top:28px;

.qs .a{font-size:26px;color:var(--dim);margin-top:26px;letter-spacing:.05em}
