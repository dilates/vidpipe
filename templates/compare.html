<style>/*CSS*/
.cp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:28px}
.col{width:520px;padding:30px 34px 34px}
.col h3{font-size:30px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.col h3 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.a h3 i{background:var(--accent)} .b h3 i{background:#ff6b6b}
.col li{list-style:none;font-size:24px;line-height:1.4;padding:11px 0;border-top:1px solid var(--line);color:#dbe3ec}
.col li:first-of-type{border-top:0}
</style>
<div class="stage"><div class="cp">
  <div class="col card a"><h3><i></i>{{a_title}}</h3><ul>{{a_items}}</ul></div>
  <div class="col card b"><h3><i></i>{{b_title}}</h3><ul>{{b_items}}</ul></div>
</div></div>
