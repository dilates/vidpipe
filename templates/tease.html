<style>/*CSS*/
.tz{position:absolute;left:96px;top:96px;display:flex;align-items:center;gap:20px;
  padding:18px 30px 18px 22px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(0,0,0,.55)}
.tz .pip{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.tz .k{font-size:18px;font-weight:700;letter-spacing:.2em;color:var(--accent);display:block;margin-bottom:5px}
.tz .t{font-size:31px;font-weight:600;letter-spacing:-.01em}
</style>
<div class="stage"><div class="tz">
  <div class="pip"></div>
  <div><span class="k">{{kicker}}</span><span class="t">{{title}}</span></div>
</div></div>
