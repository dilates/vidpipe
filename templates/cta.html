<style>/*CSS*/
.cta{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);display:flex;align-items:center;
  gap:22px;padding:20px 34px;border-radius:100px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,.6)}
.cta .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent2))}
.cta .ic svg{width:25px;height:25px;fill:#0b0e12}
.cta .txt{font-size:30px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.cta .sm{font-size:22px;color:var(--dim);font-weight:400;margin-left:4px}
</style>
<div class="stage"><div class="cta">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M2 10h4v11H2z"/><path d="M7 10l4.5-7.5a1.6 1.6 0 0 1 3 .8V9h5.2a1.8 1.8 0 0 1 1.75 2.2l-1.6 7.2A2.2 2.2 0 0 1 17.2 21H7z"/></svg></div>
  <div class="txt">{{text}}<span class="sm">{{sub}}</span></div>
</div></div>
