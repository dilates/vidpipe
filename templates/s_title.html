<style>/*CSS*/
html,body{width:1080px;height:1920px}
.st{position:absolute;left:54px;right:54px;top:150px;padding:34px 38px;border-radius:24px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 28px 70px rgba(0,0,0,.6)}
.st .k{font-size:26px;font-weight:800;letter-spacing:.24em;color:var(--accent);margin-bottom:14px}
.st .t{font-size:60px;font-weight:800;line-height:1.06;letter-spacing:-.03em}
.st .bar{height:7px;width:110px;border-radius:5px;margin-top:22px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
</style>
<div class="stage"><div class="st">
  <div class="k">{{kicker}}</div><div class="t">{{title}}</div><div class="bar"></div>
</div></div>
