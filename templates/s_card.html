<style>/*CSS*/
html,body{width:1080px;height:1920px}
.sc{position:absolute;left:54px;right:54px;bottom:250px;padding:34px 38px 36px 46px;border-radius:24px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 28px 70px rgba(0,0,0,.6)}
.sc .accentbar{border-radius:24px 0 0 24px}
.sc .k{font-size:24px;font-weight:800;letter-spacing:.22em;color:var(--accent);margin-bottom:12px}
.sc .t{font-size:46px;font-weight:800;line-height:1.1;margin-bottom:16px;letter-spacing:-.02em}
.sc li{list-style:none;font-size:34px;line-height:1.32;padding:12px 0 12px 42px;position:relative;color:#dfe6ee}
.sc li:before{content:'';position:absolute;left:4px;top:.62em;width:14px;height:14px;border-radius:4px;background:var(--accent)}
</style>
<div class="stage"><div class="sc">
  <div class="accentbar"></div><div class="k">{{kicker}}</div>
  <div class="t">{{title}}</div><ul>{{items}}</ul>
</div></div>
