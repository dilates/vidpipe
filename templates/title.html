<style>/*CSS*/
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 40%,rgba(10,13,18,.86),rgba(6,8,11,.97))}
.ti{text-align:center;max-width:1500px}
.ti .kick{font-size:24px;font-weight:700;letter-spacing:.32em;color:var(--accent);margin-bottom:26px}
.ti .t{font-size:126px;font-weight:800;letter-spacing:-.04em;line-height:.98;
  text-shadow:0 16px 60px rgba(0,0,0,.8)}
.ti .s{font-size:36px;color:var(--dim);margin-top:26px;font-weight:400}
.ti .rule{width:180px;height:6px;margin:38px auto 0;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
</style>
<div class="stage"><div class="wrap"><div class="ti">
  <div class="kick">{{kicker}}</div><div class="t">{{title}}</div>
  <div class="s">{{sub}}</div><div class="rule"></div>
</div></div></div>
